<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medieval Smash</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d17;color:#f3e8d4;font:16px system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}h1{font:clamp(24px,4vw,38px) Georgia,serif;margin:0;letter-spacing:2px}small{color:#c4a575;letter-spacing:3px;font-size:12px}button{background:#b77b35;color:#100c08;border:1px solid #e0b06e;border-radius:5px;padding:12px 18px;font:600 16px system-ui;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}.arena{position:relative;border:1px solid #655135;border-radius:8px;overflow:hidden;background:#141c2b}canvas{display:block;width:100%;aspect-ratio:16/9}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#070d18b8;padding:24px}.overlay[hidden]{display:none}.overlay h2{font:clamp(28px,5vw,52px) Georgia;margin:0 0 12px}.overlay p{max-width:450px;line-height:1.6}.overlay button{justify-self:center}.help{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;line-height:1.8;color:#c6c6ce;margin-top:14px}kbd{background:#202735;border:1px solid #485166;border-radius:4px;padding:2px 6px;color:white}.touch{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.touch button{touch-action:none;user-select:none;min-width:56px;background:#202b3c;color:#f5e2bd;border-color:#52617a}.status{color:#d4b785;font-size:14px}a{color:#e8ba79}@media(max-width:600px){main{padding:10px}header{align-items:flex-start}header button{padding:9px}small{letter-spacing:1px}.help{font-size:14px}}
.sound-controls{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 0}.sound-controls button{background:#202b3c;color:#ffe0a3;border-color:#947344}.sound-controls label{display:flex;align-items:center;gap:12px;color:#ded5c7}.sound-controls input{accent-color:#e6b663;width:150px;cursor:pointer}.header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}select{background:#202b3c;color:#ffe0a3;border:1px solid #947344;padding:10px;border-radius:5px;font:16px system-ui}header{flex-wrap:wrap}.language-control{display:flex;align-items:center;gap:8px;font-size:14px}</style>
<main><header><div><small data-i18n="arena">MEDIEVAL ARENA · 2D</small><h1>Medieval Smash</h1></div><div class="header-actions"><label class="language-control"><span data-i18n="language">Language</span><select id="language"><option value="en">English</option><option value="pt">Português</option></select></label><button id="pause">Pause</button></div></header>
<div class="arena"><canvas id="game" width="1120" height="630" data-i18n-label="canvas" aria-label="Combat arena: red dragon versus blue dragon"></canvas><div class="overlay" id="overlay"><h2 id="title">Fire against storm</h2><p id="message">Command the red dragon. Hold L to block frontal attacks while you have energy.</p><button id="start">Start duel</button></div></div>
<div class="help"><span><kbd>A</kbd> <kbd>D</kbd> <span data-i18n="move">move</span> · <kbd>W</kbd> <span data-i18n="jump">Jump</span> · <kbd>J</kbd> <span data-i18n="claw">Claws</span> · <kbd>K</kbd> <span data-i18n="fire">Fire</span> · <kbd>L</kbd> <span data-i18n="block">Block</span></span><span><kbd>P</kbd> <span data-i18n="pause">Pause</span> · <kbd>R</kbd> <span data-i18n="restart">restart</span></span></div>
<div class="touch" data-i18n-label="touch" aria-label="Touch controls"><button data-key="a" data-i18n-label="left" aria-label="Move left">←</button><button data-key="d" data-i18n-label="right" aria-label="Move right">→</button><button data-key="w" data-i18n="jump">Jump</button><button data-key="j" data-i18n="claw">Claws</button><button data-key="k" data-i18n="fire">Fire</button><button data-key="l" data-i18n="block">Block</button></div>
<p class="status" id="status" role="status"></p><div class="sound-controls"><button id="music" aria-pressed="true">Music: on</button><label for="music-volume"><span data-i18n="volume">Volume</span> <input id="music-volume" type="range" min="0" max="100" value="25"></label></div></main>
<script src="sprite-data.js"></script><script src="blue-sprite-data.js"></script><script src="engine.js"></script><script src="animation.js"></script><script src="i18n.js"></script><script src="audio.js"></script><script src="game.js"></script>
</html>
